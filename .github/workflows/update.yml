name: Update films and books
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update.mjs
        env:
          GOODREADS_RSS: ${{ secrets.GOODREADS_RSS }}
      - run: |
          git config user.name "austinwang.net bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update films and books" && git push)
