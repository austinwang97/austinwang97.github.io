<!DOCTYPE html>

<style>
  :root{--ink:#000;--dim:#8a8a8a;--bg:#fff}
  *{box-sizing:border-box}

       font:400 15px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:2px}

  .page{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:18px 20px;min-height:100vh;align-content:start}
  .col p{margin:0 0 1.4em}
  .dim{color:var(--dim)}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0}
  .foot{position:fixed;left:20px;bottom:18px;color:var(--dim)}
  @media (max-width:760px){
    .page{grid-template-columns:1fr;gap:0}
    .col{margin-bottom:1.4em}
    .foot{position:static;padding:0 20px 18px}
  }
</style>

</html>
